workflows:
  ios-release:
    name: iOS Capacitor Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple Key  # Name of the key saved in Codemagic settings
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dollardine.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web App & Sync Capacitor
        script: |
          npm run build
          npx cap sync ios
      - name: Set up Code Signing
        script: |
          xcode-project use-profiles
      - name: Build iOS App (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true